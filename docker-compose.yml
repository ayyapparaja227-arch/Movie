version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ADMIN_API_KEY=hackathon-secret-key-123
      - REDIS_URL=redis://redis:6379
    volumes:
      # Persist model store artifacts & database
      - model-store-data:/app/model-store
    depends_on:
      - redis

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  model-store-data:
